# Build and deploy the telepresence signaling server to Cloud Run (staging).
#
# Trigger: push to the "staging" branch, or manual run.
#
# Overview:
#
# 1. Authenticate to Google Cloud
# 2. Authenticate Docker to Artifact Registry
# 3. Build a Docker container
# 4. Publish it to Google Artifact Registry
# 5. Deploy it to Cloud Run
#
# One-time setup:
#
# 1. Ensure the required Google Cloud APIs are enabled:
#
#    Cloud Run            run.googleapis.com
#    Artifact Registry    artifactregistry.googleapis.com
#
# 2. Create the Artifact Registry repository "telepresence" in us-east4
#    on project pj-robots-hml.
#
# 3. Ensure the GitHub deploy service account has:
#
#    Cloud Run
#      roles/run.admin
#      roles/iam.serviceAccountUser
#
#    Artifact Registry
#      roles/artifactregistry.writer
#
# 4. Create the GitHub environment "staging" with:
#
#    Variables
#      STG_ROBOTS_API_URL
#      STG_CORS_ORIGIN
#      STG_STUN_URLS
#      STG_TURN_URLS
#      STG_TURN_REALM
#      STG_TURN_USER_ID
#      STG_TURN_CREDENTIAL_TTL
#      STG_TURN_ROBOT_CREDENTIAL_TTL
#
#    Secrets (required for coturn)
#      STG_TURN_STATIC_AUTH_SECRET   same value as TURN_STATIC_AUTH_SECRET on the coturn VPS
#
#    Do NOT set STG_TURN_USERNAME / STG_TURN_CREDENTIAL (legacy Metered). They are not
#    deployed to Cloud Run anymore; if both existed, static creds produced usernames like
#    bed464… without :telepresenca and coturn returned 401.
#
# Rooms live in process memory, so the service stays at one instance
# with session affinity and CPU always allocated (WebSocket + expiry timers).

name: Build and Deploy to Cloud Run (staging)

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: "read"
  id-token: "write"

env:
  PROJECT_ID: pj-robots-hml
  SERVICE: telepresence
  REGION: us-east4
  PORT: 8080

  # GitHub Actions deploy identity
  WIF_SERVICE_ACCOUNT: sa-deploy-pj-robots-hml@pj-robots-hml.iam.gserviceaccount.com
  WIF_PROVIDER: projects/625922616818/locations/global/workloadIdentityPools/github-pool/providers/github-provider

  # Artifact Registry
  REPO_NAME: us-east4-docker.pkg.dev/pj-robots-hml/telepresence

  # Existing VPC connector
  SVA: projects/pj-pluginbot-mgmt/locations/us-east4/connectors/sva-vpc-robots-hml

  # Default values.
  # These can be overridden by GitHub Environment Variables.
  CORS_ORIGIN: "*"

  STUN_URLS: stun:217.9.14.118:3478,stun:217-9-14-118.nip.io:3478,stun:stun.l.google.com:19302

  # Coturn VPS (UDP 3478 + TLS 443). No turn:?transport=tcp — production coturn uses no-tcp-relay.
  TURN_URLS: turn:217.9.14.118:3478,turn:217-9-14-118.nip.io:3478,turns:217-9-14-118.nip.io:443?transport=tcp

  TURN_REALM: 217-9-14-118.nip.io
  TURN_USER_ID: telepresenca
  TURN_CREDENTIAL_TTL: "86400"
  TURN_ROBOT_CREDENTIAL_TTL: "604800"

jobs:
  Build_Deploy_Cloud_Run:
    runs-on: ubuntu-latest

    environment:
      name: "staging"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          access_token_lifetime: 600s
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: us-east4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REPO_NAME }}/${{ env.SERVICE }}:${{ github.sha }}
          file: Dockerfile
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REPO_NAME }}/${{ env.SERVICE }}:${{ github.sha }}

          # GitHub Environment secrets exposed as Cloud Run env vars.
          env_vars: |
            ROBOTS_API_URL=${{ vars.STG_ROBOTS_API_URL }}
            CORS_ORIGIN=${{ vars.STG_CORS_ORIGIN || env.CORS_ORIGIN }}
            STUN_URLS=${{ vars.STG_STUN_URLS || env.STUN_URLS }}
            TURN_URLS=${{ vars.STG_TURN_URLS || env.TURN_URLS }}
            TURN_REALM=${{ vars.STG_TURN_REALM || env.TURN_REALM }}
            TURN_USER_ID=${{ vars.STG_TURN_USER_ID || env.TURN_USER_ID }}
            TURN_CREDENTIAL_TTL=${{ vars.STG_TURN_CREDENTIAL_TTL || env.TURN_CREDENTIAL_TTL }}
            TURN_ROBOT_CREDENTIAL_TTL=${{ vars.STG_TURN_ROBOT_CREDENTIAL_TTL || env.TURN_ROBOT_CREDENTIAL_TTL }}
            TURN_STATIC_AUTH_SECRET=${{ secrets.STG_TURN_STATIC_AUTH_SECRET }}

          flags: >
            --allow-unauthenticated
            --vpc-connector=${{ env.SVA }}
            --port=${{ env.PORT }}
            --cpu=1
            --memory=512Mi
            --concurrency=1000
            --min-instances=1
            --max-instances=1
            --timeout=3600
            --session-affinity
            --no-cpu-throttling
            --cpu-boost

      - name: Show Cloud Run URL
        run: echo "${{ steps.deploy.outputs.url }}"

      - name: Post Cache Docker layers
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
