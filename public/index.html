<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f14" />
    <title>TelePlugin</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="style.css" />
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="stage">
        <div class="remote-video-host" id="remoteVideoHost">
          <canvas
            id="remoteVideoCanvas"
            class="remote-video-canvas"
            aria-hidden="true"
          ></canvas>
          <video
            id="remoteVideo"
            class="remote-video-source"
            autoplay
            playsinline
            muted
          ></video>
        </div>

        <div class="vignette" aria-hidden="true"></div>

        <div
          class="stage-alert"
          id="obstacleAlert"
          role="status"
          aria-live="assertive"
          hidden
        >
          <div class="stage-alert__inner">
            <span data-i18n="alert.obstacle">Obstáculo detectado</span>
          </div>
        </div>

        <div
          class="head-look-layer"
          id="headLookLayer"
          hidden
          data-host="head-look"
          data-i18n-aria="head.layer"
          aria-label="Arraste para mover a cabeça do robô"
        >
          <p class="head-drag-hint" data-i18n="head.look">Arraste para olhar</p>
        </div>

        <div class="remote-overlay" id="remotePlaceholder">
          <div class="waiting-mark" aria-hidden="true"></div>
          <p data-i18n="status.waitingRobot">Aguardando o robô…</p>
        </div>

        <div id="localPreview" class="local-preview" hidden>
          <div class="local-preview-frame">
            <video
              id="localPreviewVideo"
              class="local-preview-video"
              autoplay
              playsinline
              muted
              data-i18n-aria="media.selfView"
              aria-label="Sua câmera"
            ></video>
            <button
              type="button"
              id="btnLocalPreviewClose"
              class="local-preview-close"
              data-i18n-aria="media.selfViewHide"
              aria-label="Ocultar pré-visualização da câmera"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <use href="assets/icons.svg#icon-close"></use>
              </svg>
            </button>
          </div>
        </div>

        <header class="hud-top">
          <div class="brand">
            <img
              class="brand-logo"
              src="assets/logo-pluginbot.png"
              alt="Pluginbot"
              data-i18n-alt="brand.alt"
            />
            <span class="room-label" id="roomLabel"></span>
          </div>
          <div class="hud-top-right">
            <div id="sessionCountdown" class="session-countdown" hidden></div>
            <div id="powerHost" class="power-host" data-host="power" hidden></div>
            <div
              class="status-chip"
              id="statusChip"
              role="status"
              aria-live="polite"
              data-i18n="status.disconnected"
            >
              Desconectado
            </div>
            <div class="lang-switch" id="langSwitch">
              <button
                type="button"
                id="langToggle"
                class="lang-current"
                aria-haspopup="listbox"
                aria-expanded="false"
                data-i18n-aria="lang.group"
                aria-label="Idioma"
              >
                <img
                  id="langCurrentFlag"
                  src="assets/flags/br.png"
                  alt=""
                  width="22"
                  height="16"
                />
              </button>
              <ul
                class="lang-menu hidden"
                id="langMenu"
                role="listbox"
                data-i18n-aria="lang.group"
              ></ul>
            </div>
          </div>
        </header>

        <div class="move-hud" id="locomotionHost" data-host="locomotion">
          <div class="joystick-wrap">
            <div
              id="joystick"
              class="joystick is-disabled"
              role="application"
              data-i18n-aria="movement.joystick"
              aria-label="Controle de movimento do robô"
            >
              <span class="joy-chevron n" aria-hidden="true"></span>
              <span class="joy-chevron e" aria-hidden="true"></span>
              <span class="joy-chevron s" aria-hidden="true"></span>
              <span class="joy-chevron w" aria-hidden="true"></span>
              <div class="joystick-stick"></div>
            </div>
            <p class="joystick-hint" id="movementHint" hidden></p>
          </div>

          <div
            class="kbd-hint"
            id="kbdHint"
            data-i18n-aria="movement.hintKeyboard"
            aria-label="WASD ou setas para mover. Espaço para parar."
          >
            <span class="kbd-key" data-key="w">W</span>
            <span class="kbd-key" data-key="a">A</span>
            <span class="kbd-key" data-key="s">S</span>
            <span class="kbd-key" data-key="d">D</span>
          </div>
        </div>

        <nav
          id="robotQuickDock"
          class="robot-quick-dock"
          aria-label="Ações rápidas do robô"
          data-i18n-aria="media.quickDock"
        >
          <button
            type="button"
            id="btnToggleRobotDrawer"
            class="quick-dock-btn main-trigger"
            aria-expanded="false"
            aria-controls="robotDrawer"
            data-i18n-aria="media.robotControlsOpen"
            aria-label="Abrir controles do robô"
          >
            <svg
              class="quick-dock-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M15 3v18" />
              <path class="panel-icon-arrow" d="m10 15-3-3 3-3" />
            </svg>
          </button>
          <button
            type="button"
            id="btnQuickVolume"
            class="quick-dock-btn"
            data-i18n-aria="volume.panel"
            aria-label="Volume do robô"
            hidden
          >
            <svg
              class="quick-dock-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              aria-hidden="true"
            >
              <use href="assets/icons.svg#icon-quick-volume"></use>
            </svg>
          </button>
          <button
            type="button"
            id="btnQuickHeadReset"
            class="quick-dock-btn"
            data-i18n-aria="media.headReset"
            aria-label="Centralizar câmera"
            hidden
          >
            <svg
              class="quick-dock-icon"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <use href="assets/icons.svg#icon-quick-head-reset"></use>
            </svg>
          </button>
          <button
            type="button"
            id="btnQuickFlashlight"
            class="quick-dock-btn"
            data-i18n-aria="media.flashlight"
            aria-label="Lanterna"
            hidden
          >
            <svg
              class="quick-dock-icon"
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              aria-hidden="true"
            >
              <use href="assets/icons.svg#icon-quick-flashlight"></use>
            </svg>
          </button>
          <button
            type="button"
            id="btnQuickEmotions"
            class="quick-dock-btn"
            data-i18n-aria="emotions.title"
            data-i18n-title="emotions.title"
            title="Expressões do robô"
            aria-label="Expressões do robô"
            hidden
          >
            <svg
              class="quick-dock-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              aria-hidden="true"
            >
              <use href="assets/icons.svg#icon-quick-emotions"></use>
            </svg>
          </button>
        </nav>

        <div
          id="robotDrawerBackdrop"
          class="robot-drawer-backdrop"
          aria-hidden="true"
        ></div>

        <aside
          id="robotDrawer"
          class="robot-drawer"
          aria-hidden="true"
          aria-label="Controles do robô"
          data-i18n-aria="media.robotControls"
        >
          <div class="robot-drawer-drag-handle" aria-hidden="true"></div>
          <div class="robot-drawer-head">
            <div class="robot-drawer-title-wrap">
              <h2 class="robot-drawer-title" data-i18n="media.robotControls">
                Controles do robô
              </h2>
            </div>
            <div class="robot-drawer-actions">
              <button
                type="button"
                id="btnToggleMockRobot"
                class="robot-drawer-header-btn mock-toggle-btn"
                data-i18n-title="media.mockEnable"
                data-i18n-aria="media.mockEnable"
                title="Simular robô conectado"
                aria-label="Simular robô conectado"
                hidden
              >
                <svg
                  viewBox="0 0 24 24"
                  width="17"
                  height="17"
                  fill="none"
                  aria-hidden="true"
                >
                  <use href="assets/icons.svg#icon-mock-robot"></use>
                </svg>
              </button>
              <button
                type="button"
                id="btnCloseRobotDrawer"
                class="robot-drawer-close"
                data-i18n-title="media.robotControlsClose"
                data-i18n-aria="media.robotControlsClose"
                title="Recolher controles"
                aria-label="Recolher controles"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  aria-hidden="true"
                >
                  <use href="assets/icons.svg#icon-drawer-close"></use>
                </svg>
              </button>
            </div>
          </div>

          <div class="robot-drawer-body" id="robotDrawerBody">
            <section
              id="drawerLocomotionSpeedHost"
              class="robot-drawer-section"
              data-host="locomotion-speed"
              hidden
            ></section>
            <section
              id="volumeHost"
              class="robot-drawer-section volume-host"
              data-host="volume"
              hidden
            ></section>
            <section
              id="drawerFlashlightHost"
              class="robot-drawer-section robot-drawer-section--action"
              data-host="flashlight"
              hidden
            ></section>
            <section
              id="drawerHeadHost"
              class="robot-drawer-section robot-drawer-section--action"
              data-host="head-drawer"
              hidden
            ></section>
            <section
              id="drawerExpressionsHost"
              class="robot-drawer-section"
              data-host="expressions"
              hidden
            ></section>
          </div>
        </aside>

        <footer class="call-bar" id="callBar">
          <div class="call-bar-primary">
            <button
              id="btnToggleMic"
              class="ctrl"
              type="button"
              disabled
              data-i18n-aria="media.micOff"
              aria-label="Ligar microfone"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <use href="assets/icons.svg#icon-mic"></use>
              </svg>
              <span class="slash" aria-hidden="true"></span>
            </button>

            <button
              id="btnToggleCam"
              class="ctrl"
              type="button"
              disabled
              data-i18n-aria="media.camOff"
              aria-label="Ligar câmera"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <use href="assets/icons.svg#icon-cam"></use>
              </svg>
              <span class="slash" aria-hidden="true"></span>
            </button>
          </div>

          <div class="call-bar-extra" id="callBarExtra">
            <button
              id="btnToggleScreenShare"
              class="ctrl"
              type="button"
              disabled
              data-i18n-aria="media.screenShareOff"
              aria-label="Compartilhar tela"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <use href="assets/icons.svg#icon-screen-share"></use>
              </svg>
            </button>

            <div class="popover-host">
              <button
                id="btnVideoQuality"
                class="ctrl quality-btn"
                type="button"
                disabled
                data-i18n-aria="video.openPanel"
                aria-label="Qualidade de vídeo"
                aria-haspopup="dialog"
                aria-expanded="false"
              >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <use href="assets/icons.svg#icon-quality"></use>
                </svg>
                <span class="quality-badge" id="qualityBadge" aria-hidden="true">H</span>
              </button>

              <div
                id="qualityPanel"
                class="hud-popover quality-panel hidden"
                role="dialog"
                data-i18n-aria="video.panelTitle"
                aria-label="Qualidade do vídeo"
              ></div>
            </div>

            <button
              id="btnSendCommand"
              class="ctrl"
              type="button"
              disabled
              data-control="beep"
              data-i18n-aria="media.ringStart"
              aria-label="Tocar chamada no robô"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <use href="assets/icons.svg#icon-ring"></use>
              </svg>
            </button>

            <div id="featureHost" class="feature-host" data-host="call"></div>
          </div>

          <button
            id="btnCallOverflow"
            class="ctrl call-overflow-trigger"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="callOverflowDrawer"
            data-i18n-aria="call.overflow"
            aria-label="Mais ações"
          >
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <use href="assets/icons.svg#icon-overflow"></use>
            </svg>
          </button>

          <button
            id="btnHangup"
            class="ctrl hangup"
            type="button"
            disabled
            data-i18n-aria="call.hangup"
            aria-label="Encerrar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <use href="assets/icons.svg#icon-hangup"></use>
            </svg>
          </button>
        </footer>

        <div
          id="callOverflowBackdrop"
          class="call-overflow-backdrop"
          aria-hidden="true"
        ></div>
        <aside
          id="callOverflowDrawer"
          class="call-overflow-drawer"
          aria-hidden="true"
          aria-label="Mais ações da chamada"
          data-i18n-aria="call.overflowMenu"
        >
          <div class="call-overflow-drag-handle" aria-hidden="true"></div>
          <ul
            id="callOverflowList"
            class="call-overflow-list"
            role="menu"
          ></ul>
        </aside>

        <div
          id="hudTooltip"
          class="hud-tooltip"
          role="tooltip"
          aria-hidden="true"
        ></div>

        <div id="endedOverlay" class="ended-overlay hidden"></div>

        <div id="inviteOverlay" class="ended-overlay hidden"></div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
